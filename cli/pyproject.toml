[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ano-shell"
version = "1.2.0"
description = "CLI et moteur de thèmes autonomes pour Ano Shell (Liquid Glass sur Hyprland)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "materialyoucolor",
]

[project.scripts]
ano-shell = "ano_shell.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ano_shell*"]

[tool.setuptools.package-data]
ano_shell = [
    "data/emojis.txt",
    "data/schemes/**/*",
    "data/templates/*",
    "data/gtk-glass/*",
]
