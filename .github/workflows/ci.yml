name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install ruff pytest pillow materialyoucolor
      - name: Lint CLI with ruff
        run: ruff check cli/ tests/
      - name: Syntax check scripts
        run: bash -n bootstrap.sh install uninstall
      - name: Run pytest suite
        run: pytest -q tests/
