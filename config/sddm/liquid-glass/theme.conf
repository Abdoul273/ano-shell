[General]
# Fond d'écran : synchronisé automatiquement avec celui d'Ano Shell
background=/var/lib/ano-shell-login/background.jpg
# Photo de profil de secours si AccountsService n'en fournit pas
avatar=/var/lib/ano-shell-login/avatar.png
# Secondes d'inactivité avant de revenir à l'écran d'horloge
idleTimeout=45
# Langue de l'écran de connexion : auto (locale système), en ou fr
lang=auto
