# ============================================================================
#  Ano Shell — Gestes pavé tactile façon macOS & animations macSpace
# ============================================================================

general {
    gaps_in = 5
    gaps_out = 10
    gaps_workspaces = 60
    border_size = 2
}

gestures {
    workspace_swipe_distance = 420
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 12
    workspace_swipe_create_new = false
}

gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
gesture = 3, up, dispatcher, global, ano-shell:missionControlOpen
gesture = 3, down, dispatcher, global, ano-shell:missionControlClose
gesture = 4, up, special, special

animations {
    enabled = true
    bezier = macSpace, 0.33, 1, 0.68, 1
    bezier = macPop, 0.22, 1, 0.36, 1
    animation = windows, 1, 4.5, macPop
    animation = windowsOut, 1, 3.8, macPop, popin 88%
    animation = fade, 1, 3.5, default
    animation = workspaces, 1, 5.5, macSpace, slide
}
