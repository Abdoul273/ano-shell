# ============================================================================
#  Ano Shell — Intégration Hyprland complète (Liquid Glass + tous les raccourcis)
#  Ajoutez simplement dans ~/.config/hypr/hyprland.conf :
#      source = ~/.config/ano-shell/hypr/shell.conf
# ============================================================================

# Palette dynamique générée par `ano-shell scheme` / `ano-shell wallpaper`
source = ~/.config/ano-shell/hypr/colors.conf

# Liseré de verre dégradé 135° (lumineux en haut à gauche, reflet en bas à droite)
$glassBorder = rgba(ffffff70) rgba(ffffff0d) rgba(ffffff0d) rgba(ffffff30) 135deg rgba(ffffff26) rgba(ffffff05) rgba(ffffff14) 135deg

# Variables d'environnement Qt / Wayland / Curseur
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qtengine
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24

# Démarrage du shell et des services de session
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME PATH
exec-once = sh -c 'export PATH="$HOME/.local/bin:$PATH"; exec ano-shell shell -d'
exec-once = hyprctl setcursor macOS 24
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sleep 2 && ~/.local/bin/ano-display-pro --apply-saved

# Flou global & ombres Liquid Glass
decoration {
    rounding = 15
    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.18
        noise = 0.012
        popups = true
        input_methods = true
        xray = false
        ignore_opacity = true
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 4
    }
}

# Couches Wayland Liquid Glass (flou natif Hyprland)
layerrule = blur on, ignore_alpha 0.2, animation fade, match:namespace ^ano-shell-drawers$
layerrule = blur on, ignore_alpha 0.0, animation fade, match:namespace ^(ano-shell|caelestia)-missioncontrol$
layerrule = blur on, ignore_alpha 0.1, no_anim on, match:namespace ^(ano-shell|caelestia)-wshud$
layerrule = no_anim on, match:namespace ^ano-shell-(border-exclusion|area-picker)$
layerrule = animation fade, match:namespace ^ano-shell-background$
layerrule = blur on, ignore_alpha 0.0, animation slide top, match:namespace kitty-quick-access

# ---------------------------------------------------------------------------
#  Fenêtres & Popups Liquid Glass (texte net, fond géré par CSS / Darkly / Kitty)
# ---------------------------------------------------------------------------
# Terminal Kitty
windowrule = opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, match:class ^(kitty)$

# Applis GTK4/GTK3 (Nautilus, Calculatrice, Éditeur, Loupe, Thunar, pavucontrol, portail Ouvrir/Enregistrer…)
windowrule = opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, match:class ^(org\.gnome\..*|org\.pulseaudio\.pavucontrol|com\.saivert\.pwvucontrol|re\.fossplant\.songrec|[Tt]hunar|xdg-desktop-portal-gtk|zenity)$

# Applis Qt / KDE (Darkly rend le fond translucide avec le schéma ano-shell.colors)
windowrule = opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, match:class ^(org\.kde\..*|.*kdeconnect.*|kdeconnectd)$

# Fenêtres & popups d'Ano Shell / Quickshell (Paramètres Nexus, sélecteur de fichiers, infos fenêtre)
windowrule = opaque off, opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, match:class ^(org\.quickshell)$

# Outils flottants Liquid Glass
windowrule = float on, center on, size 1120 700, dim_around on, stay_focused on, opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(ano-clipboard-pro|io\.caelestia\.ClipboardPro)$
windowrule = float on, center on, size 540 720, dim_around on, stay_focused on, opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(ano-display-pro|io\.caelestia\.DisplayPro)$
windowrule = float on, center on, size 760 620, dim_around on, stay_focused on, opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(ano-emoji-pro|io\.caelestia\.EmojiPro)$
windowrule = float on, center on, size 1120 760, opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(io\.caelestia\.Shortcuts)$
windowrule = float on, size 720 640, move (monitor_w*0.5-360) (monitor_h*0.14), opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(io\.caelestia\.Spotlight)$
windowrule = float on, size 440 700, move (monitor_w*0.5-220) (monitor_h*0.1), opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(io\.caelestia\.Clock)$
windowrule = float on, size 380 640, move (monitor_w*0.5-190) (monitor_h*0.16), opacity 1.0 override 1.0 override, border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(io\.caelestia\.Calc)$
windowrule = float on, size 520 600, move (monitor_w*0.5-260) (monitor_h*0.12), border_size 2, border_color $glassBorder, animation popin 90%, match:class ^(org\.gnome\.NetworkDisplays)$
windowrule = suppress_event maximize, match:class .*

# ---------------------------------------------------------------------------
#  Raccourcis globaux Ano Shell & gouttes Liquid Glass
# ---------------------------------------------------------------------------
bindr = SUPER, Super_L, global, ano-shell:launcher
bind = SUPER, Space, global, ano-shell:spotlight
bind = SUPER SHIFT, Space, global, ano-shell:siri
bind = SUPER, A, global, ano-shell:dashboard
bind = SUPER, N, global, ano-shell:sidebar
bindl = CTRL ALT, C, global, ano-shell:clearNotifs
bind = SUPER, K, global, ano-shell:showall
bind = SUPER, I, global, ano-shell:nexus
bind = SUPER, O, global, ano-shell:calculator
bind = SUPER, V, global, ano-shell:clipboard
bind = SUPER, Period, global, ano-shell:emoji
bind = SUPER, P, global, ano-shell:display
bind = SUPER, H, global, ano-shell:keyhelp
bind = SUPER, Tab, global, ano-shell:missionControl
bind = SUPER SHIFT, N, global, ano-shell:quicknotes
bind = SUPER SHIFT, T, global, ano-shell:quicktasks
bind = SUPER SHIFT, O, global, ano-shell:clock
bind = SUPER SHIFT, B, global, ano-shell:earbuds
bind = SUPER SHIFT, A, global, ano-shell:agentos
bind = SUPER SHIFT, D, global, ano-shell:dictation
bind = SUPER SHIFT, W, global, ano-shell:writing
bind = SUPER ALT, T, global, ano-shell:translate
bind = SUPER, L, global, ano-shell:lock
bind = SUPER ALT, L, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; setsid -f ano-shell shell -d; sleep 0.4; qs -c ano-shell ipc call lock lock'
bindl = SUPER SHIFT, L, exec, systemctl suspend-then-hibernate
bind = SUPER, BackSpace, global, ano-shell:session
bind = CTRL ALT, Delete, global, ano-shell:session
bind = SUPER SHIFT, Q, exec, ~/.local/bin/ano-quit-app --active
bind = SUPER SHIFT, F, exec, qs -c ano-shell ipc call focus toggle
bind = SUPER, grave, exec, kitten quick-access-terminal
bindr = SUPER SHIFT, R, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; hyprctl reload && (ano-shell shell -k; sleep 1.5; setsid -f ano-shell shell -d) & notify-send -a ano-shell "Système actualisé" "Hyprland et Ano Shell rechargés"'

# ---------------------------------------------------------------------------
#  Captures d'écran, enregistrement vidéo & pipette couleur
# ---------------------------------------------------------------------------
bindl = , Print, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; pw-play "$HOME/.config/quickshell/ano-shell/assets/sounds/screenshot.wav" 2>/dev/null & ano-shell screenshot'
bind = SUPER, Print, global, ano-shell:screenshot
bind = SUPER SHIFT, S, global, ano-shell:screenshotFreeze
bind = SUPER SHIFT ALT, S, global, ano-shell:screenshot
bind = CTRL ALT, R, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; exec ano-shell record'
bind = SUPER ALT, R, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; exec ano-shell record -s'
bind = CTRL SUPER, R, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; exec ano-shell record'
bind = CTRL ALT, M, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; exec ano-shell record -s'
bind = SUPER SHIFT ALT, R, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; exec ano-shell record -r'
bind = SUPER SHIFT, C, exec, hyprpicker -a

# ---------------------------------------------------------------------------
#  Luminosité, Volume & Média (fonctionnent même écran verrouillé)
# ---------------------------------------------------------------------------
bindl = , XF86MonBrightnessUp, global, ano-shell:brightnessUp
bindl = , XF86MonBrightnessDown, global, ano-shell:brightnessDown

bindl = , XF86AudioPlay, global, ano-shell:mediaToggle
bindl = , XF86AudioPause, global, ano-shell:mediaToggle
bindl = CTRL SUPER, Space, global, ano-shell:mediaToggle
bindl = , XF86AudioNext, global, ano-shell:mediaNext
bindl = CTRL SUPER, Equal, global, ano-shell:mediaNext
bindl = , XF86AudioPrev, global, ano-shell:mediaPrev
bindl = CTRL SUPER, Minus, global, ano-shell:mediaPrev
bindl = , XF86AudioStop, global, ano-shell:mediaStop
bindl = CTRL SUPER, Backspace, global, ano-shell:mediaStop

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = SUPER SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = , XF86AudioRaiseVolume, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+'
bindle = , XF86AudioLowerVolume, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-'

# Gestes pavé tactile macOS + animations macSpace
source = ~/.config/ano-shell/hypr/gestures.conf
