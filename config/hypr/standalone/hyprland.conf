# ============================================================================
#  Ano Shell — Configuration Hyprland autonome (clé en main pour installation vierge)
# ============================================================================

monitor = , preferred, auto, 1

# Applications par défaut
$terminal = kitty
$fileManager = nautilus
$browser = google-chrome-stable

# Agents système essentiels
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = mpris-proxy

input {
    kb_layout = fr
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    layout = dwindle
    col.active_border = rgba(ffffff70) rgba(ffffff30) 135deg
    col.inactive_border = rgba(ffffff20)
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

# Raccourcis fenêtres essentiels
bind = SUPER, Return, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, W, exec, $browser
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER ALT, Space, togglefloating
bind = SUPER, L, exec, qs -c ano-shell ipc call lock lock

# Navigation bureaux (1..9 + gauche/droite)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER, Left, workspace, r-1
bind = SUPER, Right, workspace, r+1

# Souris : déplacer / redimensionner
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Intégration complète d'Ano Shell (verre, raccourcis, gestes, démarrage)
source = ~/.config/ano-shell/hypr/shell.conf
