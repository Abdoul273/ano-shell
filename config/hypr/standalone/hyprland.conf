# ============================================================================
#  Ano Shell — Configuration Hyprland autonome (clé en main Arch « no desktop »)
# ============================================================================

monitor = , preferred, auto, 1

# Applications par défaut
$terminal = kitty
$fileManager = nautilus
$browser = sh -c 'command -v google-chrome-stable >/dev/null && exec google-chrome-stable || exec firefox'

# Agents système essentiels
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = mpris-proxy

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.3
    }
}

general {
    layout = dwindle
    col.active_border = rgba(ffffff70) rgba(ffffff30) 135deg
    col.inactive_border = rgba(ffffff20)
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

xwayland {
    force_zero_scaling = true
}

# Applications rapides
bind = SUPER, T, exec, $terminal
bind = SUPER, Return, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, W, exec, $browser
bind = CTRL ALT, V, exec, pwvucontrol
bind = CTRL SHIFT, Escape, exec, kitty -e btop
bind = SUPER, M, exec, sh -c 'export PATH="$HOME/.local/bin:$PATH"; exec kitty -e onde-cli'

# Fenêtres : fermer, plein écran, flottant, focus, redimensionner
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER ALT, F, fullscreen, 1
bind = SUPER ALT, Space, togglefloating
bind = SUPER SHIFT, P, pin
bind = CTRL SUPER, Backslash, centerwindow
bind = ALT, Tab, cyclenext
bind = SHIFT ALT, Tab, cyclenext, prev

bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d

binde = SUPER, Minus, resizeactive, -30 0
binde = SUPER, Equal, resizeactive, 30 0
binde = SUPER SHIFT, Minus, resizeactive, 0 -30
binde = SUPER SHIFT, Equal, resizeactive, 0 30

# Bureaux (1..10, molette, suivant/précédent, bureau spécial)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, 1, movetoworkspace, 1
bind = SUPER ALT, 2, movetoworkspace, 2
bind = SUPER ALT, 3, movetoworkspace, 3
bind = SUPER ALT, 4, movetoworkspace, 4
bind = SUPER ALT, 5, movetoworkspace, 5
bind = SUPER ALT, 6, movetoworkspace, 6
bind = SUPER ALT, 7, movetoworkspace, 7
bind = SUPER ALT, 8, movetoworkspace, 8
bind = SUPER ALT, 9, movetoworkspace, 9
bind = SUPER ALT, 0, movetoworkspace, 10
bind = CTRL SUPER, Left, workspace, -1
bind = CTRL SUPER, Right, workspace, +1
bind = SUPER, Page_Up, workspace, -1
bind = SUPER, Page_Down, workspace, +1
bind = SUPER, mouse_up, workspace, -1
bind = SUPER, mouse_down, workspace, +1
bind = CTRL SUPER SHIFT, Left, movetoworkspace, -1
bind = CTRL SUPER SHIFT, Right, movetoworkspace, +1
bind = SUPER, S, togglespecialworkspace, special
bind = SUPER ALT, S, movetoworkspace, special:special

# Souris & clavier : déplacer / redimensionner
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER, Z, movewindow
bindm = SUPER, X, resizewindow

# Intégration complète d'Ano Shell (Liquid Glass, raccourcis, gestes, démarrage)
source = ~/.config/ano-shell/hypr/shell.conf
